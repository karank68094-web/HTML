<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Banner</title>
    <link rel="stylesheet" href="style.css">
    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    width:100%;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
}



nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 80px;
}

.logo{
    color:#38bdf8;
    font-size:35px;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:35px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
}

nav ul li a:hover{
    color:#38bdf8;
}



.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:80px;
}

.left{
    width:50%;
}

.left h3{
    color:#38bdf8;
    font-size:25px;
}

.left h1{
    font-size:65px;
    margin:15px 0;
}

.left span{
    color:#38bdf8;
}

.left h2{
    font-size:35px;
    margin-bottom:20px;
}

.left p{
    font-size:18px;
    line-height:30px;
    width:90%;
    color:#ddd;
}

.btn{
    margin-top:35px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-right:15px;
    transition:.4s;
}

button:hover{
    transform:translateY(-5px);
    background:white;
    color:#111;
}

.btn2{
    background:transparent;
    border:2px solid #38bdf8;
}



.right{
    width:40%;
    display:flex;
    justify-content:center;
}

.right img{
    width:420px;
    height:420px;
    border-radius:50%;
    object-fit:cover;
    border:8px solid #38bdf8;
    box-shadow:0 0 50px #38bdf8;
    transition:.5s;
}

.right img:hover{
    transform:scale(1.05);
}



@media(max-width:900px){

.hero{
    flex-direction:column;
    text-align:center;
}

.left,
.right{
    width:100%;
}

.right img{
    width:300px;
    height:300px;
    margin-top:40px;
}

nav{
    flex-direction:column;
}

nav ul{
    margin-top:20px;
}

}</style>
</head>
<body>

<header>

    <nav>
        <h2 class="logo">Karan.</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Skills</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="hero">

        <div class="left">

            
            <h1>I'm <span>Karan Kumar</span></h1>

            <h2>Web Developer</h2>

            <p>
                I create beautiful, responsive and modern websites
                using HTML, CSS and JavaScript.
            </p>

            <div class="btn">
                <button>Hire Me</button>
                <button class="btn2">Contact</button>
            </div>

        </div>

        <div class="right">
            <img src="pic/photo1.jpg" alt="">
        </div>

    </div>

</header>

</body>
</html>
