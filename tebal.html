<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visit Varanasi Layout Goal</title>
    <style>
        body {
            margin: 50px;
            font-family: Arial, sans-serif;
            background: rgb(red, green, blue);
            color: #2b2112;
            line-height: 1.7
        }

        .wrap {
            max-width: 980px;
            margin: auto;
            padding: 32px 16px
        }

        .card {
            background:white;
            border: 1px solid #efdfb2;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 18px 50px rgba(128, 81, 0, .12)
        }

        h1 {
            margin-top: 0;
            color: #d97706
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px
        }

        .box {
            background: #fff7ea;
            border: 1px solid #efdfb2;
            border-radius: 16px;
            padding: 16px;
            font-weight: 700
        }

        @media(max-width:700px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <section class="card">
            <h1>Lesson Goal: Multi-Level Layout  </h1>
            <p>A multi-level layout means a layout inside another layout. We will build a Visit Varanasi page section by
                section.</p>
            <div class="grid">
                <div class="box">Outer page layout: Grid</div>
                <div class="box">Hero layout: Grid</div>
                <div class="box">Toolbar: Flexbox</div>
                <div class="box">Cards: Grid again</div>
            </div>
        </section>
    </main>
</body>

</body>

</html>
