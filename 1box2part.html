<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            width: 600px;
            height: 200px;
            gap: 10px;
            border: 2px solid rgb(36, 200, 33);
        }

        .part {
            flex: 1;
            border-right: 1px solid rgb(188, 227, 47);
            text-align: center;
            padding-top: 80px;
            background-color: chocolate;
        }
        .part1 {
            flex: 1;
            border-right: 1px solid rgb(188, 227, 47);
            text-align: center;
            padding-top: 80px;
            background-color: rgb(30, 210, 78);
        }

        .part:last-child {
            border-right: red;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="part"></div>
    <div class="part1"></div>
    <div class="part"></div>
</div>

</head>


</html>
