<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

      .myboll{
     background-color: rgb(50, 225, 76);
     width: 120px; 
      height: 120px;
     border-radius: 75px;
     animation-name: yesboll;
     animation-duration: 13s;
    animation-iteration-count: infinite;
    position: absolute;
     transform: rotate(90deg) scale(4);

      } 
      @keyframes yesboll 
      {
        25%{
            left:0%;
            top: 0%;
          
            
            background-color: coral;
             border-radius: 50%;
        }
        50%{left: 100%;
           top: 0%;
            
            
            background-color: green;
            border-radius: 50%;
        }
        75%{
        top: 100%;
        left: 100%;
        
        background-color: chartreuse;
         border-radius:50% ; 
        }
         100%{
            top:0%;
            left: 100%;
            
          
            background-color: coral;
             border-radius: 50%;
        }      
      }

    </style>
</head>

<body>

    <div class="myboll"><img src="pic/goli.jpg" ></div>
    
</body>
</html>
