<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        
        .main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
        }

        
        .left {
            width: 400px;
        }

        .left img {
            width: 300px;
        }

        .left h2 {
            font-size: 25px;
            font-weight: normal;
        }

        
        .container {
            background-color: white;
            padding: 20px;
            width: 380px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px #ccc;
            text-align: center;
        }

        .container h2 {
            color: #1877f2;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        /* Login button */
        .bottomg {
            background-color: #1877f2;
            width: 100%;
            height: 45px;
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot {
            color: #1877f2;
            margin: 18px;
            cursor: pointer;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }

        .Create-btn {
            background-color: #42b72a;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Mobile */
        @media(max-width: 800px) {

            .main {
                flex-direction: column;
                gap: 20px;
            }

            .left {
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="main">

        <!-- LEFT SIDE PHOTO -->
        <div class="left">

            <img src="pic/facebook.jpg" alt="Facebook">

            <h2>
                Facebook helps you connect and share
                with the people in your life.
            </h2>

        </div>


        
        <div class="container">

            <h2>Log in to Facebook</h2>

            <input
                type="text"
                placeholder="Email or mobile Number"
            >

            <input
                type="password"
                placeholder="Password"
            >

            <button class="bottomg">
                Login
            </button>

            <div class="forgot">
                Forgot Password?
            </div>

            <hr>

            <button class="Create-btn">
                Create new Account
            </button>

        </div>

    </div>

</body>

</html>
