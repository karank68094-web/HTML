<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: rgb(11, 11, 142);
            border-radius: 50px;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 80px;
        }

        .left {
            width: 50%;
        }

        .left h1 {
            font-size: 65px;
            margin: 15px;
        }

        .left span {
            color: #38bdf8;
        }

        .left h2 {
            font-size: 35px;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 18px;
            line-height: 30px;
            width: 90%;
            color: #ddd;
        }

        .right {
            width: 40%;
            display: flex;
            justify-content: center;
        }

        .right img {
            width: 420px;
            height: 420px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #38bdf8;
            box-shadow: 50px #38bdf8;
            transition: scale(.5s);
        }

        .right img:hover {
            transition: scale(1.05);
        }
    </style>
</head>

<body>



    <div class="hero">
        <div class="left">

            <h1>I'm <span>Karan Kumar</span></h1>
            <h2>web Developer</h2>

            <p>I create beautiful,responsive
                using HTML ,CSS and Javascript
            </p>
        </div>
        <div class="right">
            <img src="pic/photo1.jpg">
        </div>


    </div>


</body>

</html>
