<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            width: 300px;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            margin-left: 10px;
            cursor: pointer;
        }

        img {
            margin-top: 20px;
            width: 300px;
            height: auto;
            border: 2px solid sandybrown;
        }
    </style>
</head>
<body>

    <h2>Display Image Path</h2>

    <input type="text" id="imagePath" placeholder="Enter image path ">
    <button onclick="showImage()">Show Image</button>

    <br><br>

    <img id="displayImage" src="" alt="Image ">

    <script>
        function showImage() {
            let path = document.getElementById("imagePath").value;
            console.log(path);
            document.getElementById("displayImage").src = path;
        }
    </script>

</body>
</html>
