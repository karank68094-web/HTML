<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Animation</title>

  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: #fff7ed;
      font-family: Arial, sans-serif;
    
         }

    .box {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: green;
      animation: moveBox 2s ease-in-out infinite alternate;
    }

    @keyframes moveBox {
      from {
        transform: translateY(-100px);
      }

      to {
        transform: translateX(100px);
      }
    }
     .pic{

      width: 50px;
      height: 50px;
      object-fit: cover;
     }
     
  </style>
</head>

<body>
  <img class="box" src="pic/karan.jpg">
  </div>
</body>
</html>
