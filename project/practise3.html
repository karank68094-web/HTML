<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flower-grid {
            display: grid;
            border-radius: 100px;
            gap: 50px;
            max-width:40px;
            height: 50px;

        }
    
        
        .bo{
            border: 4px solid red;
        }
    </style>

</head>

<body>
    <div class="flower-grid">
        <article class="flower-card">
            <img class="bo" src="/pic/6.jpg" alt="Marigold flower">
            <p>Marigold</p>
        </article>

        <article class="flower-card">
            <img src="/pic/7.jpg" alt="Lotus flower">
            <p></p>
        </article>
        <article class="flower-card">
            <img src="/pic/8.jpg" alt="Marigold">
        </article>
        <article class="flower-card">
            <img src="/pic/9.jpg" alt="Lotus flower">
        </article>
    </div>

</body>

</html>
