<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Style Profile Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#e9ebee;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

/* Top Menu */
.top{
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#80ec0d;
}

.top a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

/* Cover Photo */
.cover img{
    width:100%;
    height:170px;
    object-fit:cover;
}

/* Profile Photo */
.profile{
    text-align:center;
    margin-top:-70px;
}

.profile img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
}

/* Name */
.name{
    text-align:center;
    margin-top:10px;
}

.name h2{
    color:#222;
}

.name p{
    color:gray;
    margin-top:5px;
}

/* Information */
.info{
    margin:25px;
}

.info p{
    font-size:18px;
    margin:15px 0;
}

/* Buttons */
.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#0a43c9;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e2ea08;
}

</style>

</head>
<body>

<div class="container">

    <
    <div class="top">
        <a href="shoping.html">🛒 Shopping</a>

        <a href="https://wa.me/8112584027" target="_blank">
            📱 WhatsApp
        </a>
    </div>

    
    <div class="cover">
        <img src="pic/cover.jpg" alt="Cover">
    </div>

    
    <div class="profile">
        <img src="pic/photo1.jpg" alt="Profile">
    </div>

    
    <div class="name">
        <h2>KARAN BIND</h2>
        <p>BCA Student | HTML/CSS</p>
    </div>

    
    <div class="info">
        <p>📧 karanbind123@gmail.com</p>
        <p>📞 +91 9876543210</p>
        <p>📍 Varanasi, Uttar Pradesh, India</p>
    </div>

    
    <div class="buttons">
        <button>Follow</button>
        <button>Contact</button>
        <button>Share</button>
    </div>

</div>

</body>
</html>
