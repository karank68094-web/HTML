<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Page</title>
  <style>
     .ball{
background-color:red;
width:200px;
height:200px;
border-radius:50%;
animation-name:myball;
animation-duration:10s;
animation-iteration-count:infinite;
}
     @keyframes myball
{
25%{
border-radius:50%;
background-color:red;
  width: 300px;
  height: 300px;
}
50%{
border-radius:0%;
background-color:blue;
width:500px;
height:500px;
}


75%{
border-radius:50%;
background-color:green;
}
}
  </style>
</head>
<div class="ball"></div>
  </body>
</html>
